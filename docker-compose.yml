version: '3.8'

services:
  service-registry:
    build:
      context: ./service-registry
    ports:
      - "8761:8761"
    networks:
      - logistra-net

  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - service-registry
    networks:
      - logistra-net

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8081:8081"
    depends_on:
      - service-registry
    networks:
      - logistra-net

  product-service:
    build:
      context: ./product-service
    ports:
      - "8082:8082"
    depends_on:
      - service-registry
    networks:
      - logistra-net

  inventory-service:
    build:
      context: ./inventory-service
    ports:
      - "8083:8083"
    depends_on:
      - service-registry
    networks:
      - logistra-net

  order-service:
    build:
      context: ./order-service
    ports:
      - "8084:8084"
    depends_on:
      - service-registry
    networks:
      - logistra-net

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    networks:
      - logistra-net

networks:
  logistra-net:
    driver: bridge
