server.port=8084
spring.application.name=order-service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Database configuration (Embedded H2 / PostgreSQL ready)
spring.datasource.url=jdbc:h2:mem:logistra_order_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Resilience4j
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.wait-duration-in-open-state=5000ms

management.endpoints.web.exposure.include=health,info
